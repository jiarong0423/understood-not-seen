<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Matching evaluation</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;background:#fff;color:#1b1f24}
@media(prefers-color-scheme:dark){body{background:#0f1317;color:#e6e9ee}}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #8884;padding:4px 8px;text-align:left}.s{color:#888}</style></head>
<body><h1>On-device matching: held-out check</h1>
<p class="s">Runs in this tab. 20 titles that should match an activity and 12 that should not. The titles were written after the vocabulary was fixed, but by the same author, so treat the numbers as optimistic.</p>
<p id="st">Loading the model (about 120 MB the first time)...</p><div id="out"></div>
<script type="module">
import { loadEmbedder, buildIndex } from "./js/embed.js";
const POS=[["Mixed doubles rotation and net play tips","Badminton court"],["How to read greens and lag putts closer","Golf course"],["Spice levels and numbing broth at a hot pot buffet","Hot pot restaurant"],["Weekly lap swim schedule at the community pool","Swimming pool"],["Which bourbon and rye whiskeys are worth buying","Wine bar"],["Retrospective of a modernist painter opens downtown","Art museum"],["Bartender's guide to stirred drinks","Cocktail bar"],["Grand slam finals recap and baseline rallies","Tennis court"],["A kaiseki dinner in Kyoto with seasonal courses","Fine dining restaurant"],["Philharmonic autumn symphony series tickets","Concert hall"],["Onsen etiquette and hot spring towns","Spa"],["Shoyu versus miso broth for beginners","Ramen restaurant"],["Powder days and best lift passes this winter","Ski resort"],["Kitchen rules and dinking at the pickleball court","Pickleball court"],["Cue ball control for nine-ball breaks","Billiards"],["Gutter balls to 200: lane etiquette and spare conversion","Bowling alley"],["Core engagement and spring tension on the reformer","Pilates studio"],["Trigger point release for tight shoulders","Massage"],["高爾夫球場推桿與球道策略","Golf course"],["牛肉湯麵與水餃店推薦","Noodle shop"]];
const NEG=["How to negotiate a salary offer","Docker compose for local development","Central bank rate path scenarios","Review: the latest smartphone camera","Tax filing checklist for freelancers","Open source license comparison","Understanding bond duration and convexity","A history of the Roman Empire podcast","Machine learning model evaluation metrics","Newsletter on startup funding rounds","Netflix series recommendations","房貸利率比較表"];
try{
 const ext=await loadEmbedder(p=>{document.getElementById("st").textContent="Loading the model "+Math.round(p*100)+"%"});
 const kb=(await (await fetch("kb/activities.json")).json()).filter(a=>a.tag_id);const vocab=await (await fetch("kb/vocab.json")).json();
 const idx=await buildIndex(ext,kb,vocab);
 const emb=async t=>(await ext(t,{pooling:"mean",normalize:true})).tolist();
 const V=await emb([...POS.map(p=>p[0]),...NEG]);
 const best=v=>{const s={};idx.vecs.forEach((a,i)=>{let d=0;for(let k=0;k<v.length;k++)d+=v[k]*a[k];if(!(idx.labels[i] in s)||d>s[idx.labels[i]])s[idx.labels[i]]=d});return Object.entries(s).sort((x,y)=>y[1]-x[1])[0]};
 const R=V.map(best);let h="<table><tr><th>Threshold</th><th>Correct</th><th>Wrong activity</th><th>Missed</th><th>False positives</th></tr>";
 for(const th of [0.4,0.45,0.5,0.55]){let ok=0,wr=0,ms=0,fp=0;POS.forEach((p,i)=>{const [a,s]=R[i];if(s>=th){a===p[1]?ok++:wr++}else ms++});NEG.forEach((_,j)=>{if(R[POS.length+j][1]>=th)fp++});
  h+=`<tr><td>${th}</td><td>${ok}/${POS.length}</td><td>${wr}</td><td>${ms}</td><td>${fp}/${NEG.length}</td></tr>`}
 const bad=[];POS.forEach((p,i)=>{const [a,s]=R[i];if(s<0.5)bad.push(`missed: ${p[0]} (best ${a}, ${s.toFixed(2)})`);else if(a!==p[1])bad.push(`wrong activity: ${p[0]} -> ${a} (${s.toFixed(2)}), wanted ${p[1]}`)});NEG.forEach((t,j)=>{const [a,s]=R[POS.length+j];if(s>=0.5)bad.push(`false positive: ${t} -> ${a} (${s.toFixed(2)})`)});
 document.getElementById("out").innerHTML=h+"</table><p class='s'>The page uses threshold 0.5. Misses at 0.5:</p><ul>"+bad.map(x=>"<li>"+x.replace(/</g,"&lt;")+"</li>").join("")+"</ul><p class='s'>Numbers can move by one item between runs because batch size changes the vectors slightly.</p>";document.getElementById("st").textContent="Done.";
}catch(e){document.getElementById("st").textContent="Could not run here: "+e}
</script></body></html>
